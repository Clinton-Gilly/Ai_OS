[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-os"
version = "0.1.0"
description = "A natural-language AI control layer for Windows 11"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Clinton (Xuremi Technologies)" }]
keywords = ["windows", "assistant", "automation", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
# The core runs on the standard library alone so it stays installable anywhere.
dependencies = []

[project.optional-dependencies]
windows = [
    "send2trash>=1.8",   # real Recycle Bin support
    "psutil>=5.9",       # richer process listing
]
voice = [
    "SpeechRecognition>=3.10",   # push-to-talk transcription
    "PyAudio>=0.2.13",           # microphone access
]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.scripts]
ai-os = "ai_os.cli:main"

[project.urls]
Repository = "https://github.com/Clinton-Gilly/Ai_OS"

[tool.setuptools.packages.find]
include = ["ai_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]
